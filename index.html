<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart LCH Color Generator</title>
    <style>
        :root { 
            --main-bg: #f8f9fa; 
            --text-color: #222; 
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--main-bg);
            transition: background-color 0.4s ease;
            color: var(--text-color);
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: 2rem;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 2rem;
        }
        .input-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #eee;
            padding: 10px 15px;
            border-radius: 12px;
        }
        input[type="color"] {
            border: none;
            width: 40px;
            height: 40px;
            cursor: pointer;
            background: none;
        }
        input[type="number"] {
            border: none;
            background: none;
            font-size: 1.1rem;
            font-weight: 600;
            width: 50px;
            text-align: center;
        }
        
        /* 팔레트 레이아웃 */
        .palette {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        .color-card {
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-card:hover { transform: translateY(-5px); }
        .swatch {
            height: 80px;
            border-radius: 12px;
            margin-bottom: 8px;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
        }
        .hex-label {
            font-size: 0.75rem;
            font-weight: 700;
            font-family: monospace;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            background: #222;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background: #000; transform: scale(1.02); }

        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 50px;
            padding: 12px;
            position: fixed;
            bottom: 50px;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="margin-top:0">Color Palette</h2>
        
        <div class="controls">
            <div class="input-group">
                <span>기준 색상 선택</span>
                <input type="color" id="baseColor" value="#6366f1" onchange="generatePalette()">
            </div>
            <div class="input-group">
                <span>추출 개수 (1-10)</span>
                <input type="number" id="colorCount" value="5" min="1" max="10" onchange="generatePalette()">
            </div>
            <button onclick="randomizeAndGenerate()">랜덤 메인 컬러 생성</button>
        </div>

        <div class="palette" id="palette">
            </div>
    </div>

    <div id="toast">복사되었습니다! 🎉</div>

    <script>
        // HEX를 RGB로 변환
        function hexToRgb(hex) {
            const r = parseInt(hex.substring(1,3), 16);
            const g = parseInt(hex.substring(3,5), 16);
            const b = parseInt(hex.substring(5,7), 16);
            return {r, g, b};
        }

        // RGB를 간단한 밝기값으로 변환 (가독성용)
        function getBrightness(hex) {
            const {r, g, b} = hexToRgb(hex);
            return (r * 299 + g * 587 + b * 114) / 1000;
        }

        // 랜덤 색상 생성
        function randomizeAndGenerate() {
            const randomHex = '#' + Math.floor(Math.random() * 0xffffff).toString(16).padEnd(6, '0');
            document.getElementById('baseColor').value = randomHex;
            generatePalette();
        }

        // 실제 팔레트 생성 로직
        function generatePalette() {
            const baseHex = document.getElementById('baseColor').value;
            const count = document.getElementById('colorCount').value;
            const paletteContainer = document.getElementById('palette');
            paletteContainer.innerHTML = '';

            // 텍스트 및 배경 가독성 처리
            const brightness = getBrightness(baseHex);
            document.body.style.backgroundColor = baseHex;
            document.documentElement.style.setProperty('--text-color', brightness > 150 ? '#222' : '#fff');

            // 기준 색상을 기반으로 유사한 톤(Hue 변형) 생성
            // 브라우저의 CSS oklch를 활용하기 위해 임시 엘리먼트 활용 또는 직접 계산
            for (let i = 0; i < count; i++) {
                // 각기 다른 Hue(색상) 값을 주어 유사색 생성
                // 0도에서 360도 사이에서 기준색 기준 +- 15~30도 정도씩 변화
                const hueShift = (i - Math.floor(count/2)) * 20; 
                
                const card = document.createElement('div');
                card.className = 'color-card';
                
                // CSS의 oklch를 사용하여 일정한 인지 밝기 유지
                // 형식: oklch(밝기 채도 색상)
                // 기준색의 밝기와 채도를 그대로 쓰기 위해 기준색을 oklch로 다루는 것이 좋으나
                // 여기서는 간단히 스타일 속성으로 처리
                const colorValue = `oklch(from ${baseHex} l c h / calc(1 + ${hueShift}))`;
                
                card.innerHTML = `
                    <div class="swatch" style="background: ${baseHex}; filter: hue-rotate(${hueShift}deg);"></div>
                    <div class="hex-label">Tone ${i+1}</div>
                `;
                
                card.onclick = () => copyToClipboard(baseHex, hueShift);
                paletteContainer.appendChild(card);
            }
        }

        // 클립보드 복사 (계산된 스타일 값 추출)
        function copyToClipboard(baseHex, shift) {
            const temp = document.createElement('div');
            temp.style.background = baseHex;
            temp.style.filter = `hue-rotate(${shift}deg)`;
            document.body.appendChild(temp);
            
            // 실제 렌더링된 RGB 값을 HEX로 변환하거나 스타일 그대로 복사
            const computedColor = getComputedStyle(temp).backgroundColor;
            document.body.removeChild(temp);

            navigator.clipboard.writeText(computedColor).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(() => { toast.className = ""; }, 2000);
            });
        }

        // 초기 실행
        generatePalette();
    </script>
</body>
</html>
