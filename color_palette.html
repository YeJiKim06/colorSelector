<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Color Palette Generator</title>
    <link rel="stylesheet" href="css/color_palette.css" />
</head>

<body>
    <main class="container">
        <section class="header">
            <div>
                <div class="eyebrow">COLOR PALETTE</div>
                <h1>Color Palette</h1>
                <p class="description">
                    기준 색상을 선택하고 피커 하단의 ↕ 버튼을 통해 포맷 드롭다운 메뉴를 열어보세요.
                    선택한 포맷에 따라 색상 카드의 값이 실시간으로 변경됩니다.
                </p>
            </div>

            <div class="preview-orb" id="previewOrb"></div>
        </section>

        <section class="controls">
            <div class="input-group">
                <label>기준 색상</label>
                <div class="color-picker-trigger" id="pickerTrigger"></div>
                
                <div class="dev-picker-popover" id="pickerPopover">
                    <div class="spectrum-box" id="spectrumBox">
                        <div class="spectrum-cursor" id="spectrumCursor"></div>
                    </div>
                    
                    <div class="sliders-row">
                        <div class="current-color-circle" id="currentColorCircle"></div>
                        <div class="sliders-column">
                            <input type="range" min="0" max="360" value="0" class="picker-slider hue-slider" id="hueSlider" />
                            <input type="range" min="0" max="1" step="0.01" value="1" class="picker-slider alpha-slider" id="alphaSlider" />
                        </div>
                    </div>

                    <div class="format-control-wrapper">
                        <div class="format-controller-box">
                            <input type="text" class="format-value-input" id="formatValueInput" />
                            <button type="button" class="format-switch-btn" id="formatSwitchBtn" title="포맷 선택 메뉴 열기">↕</button>
                        </div>
                        <div class="format-label-sub" id="formatLabelSub">HEX</div>

                        <div class="format-dropdown-menu" id="formatDropdownMenu">
                            <div class="format-option-item selected" data-format="HEX">HEX</div>
                            <div class="format-option-item" data-format="RGB">RGB</div>
                            <div class="format-option-item" data-format="HSL">HSL</div>
                            <div class="format-option-item" data-format="HWB">HWB</div>
                            <div class="format-option-item" data-format="LCH">LCH</div>
                            <div class="format-option-item" data-format="OKLCH">OKLCH</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label for="colorCount">추출 개수</label>
                <input type="number" id="colorCount" value="5" min="1" max="10" />
            </div>

            <button type="button" onclick="randomizeAndGenerate()">
                랜덤 생성
            </button>
        </section>

        <section class="palette" id="palette"></section>

        <p class="hint">색상 카드를 클릭하면 설정된 포맷으로 클립보드에 복사됩니다.</p>
    </main>

    <div id="toast">복사되었습니다 🎉</div>

    <script>
        let currentFormat = "HEX";

        let currentH = 0;
        let currentS = 77;
        let currentL = 16;
        let currentA = 1;

        const pickerTrigger = document.getElementById("pickerTrigger");
        const pickerPopover = document.getElementById("pickerPopover");
        const spectrumBox = document.getElementById("spectrumBox");
        const spectrumCursor = document.getElementById("spectrumCursor");
        const currentColorCircle = document.getElementById("currentColorCircle");
        const hueSlider = document.getElementById("hueSlider");
        const alphaSlider = document.getElementById("alphaSlider");
        const formatValueInput = document.getElementById("formatValueInput");
        const formatSwitchBtn = document.getElementById("formatSwitchBtn");
        const formatDropdownMenu = document.getElementById("formatDropdownMenu");
        const formatLabelSub = document.getElementById("formatLabelSub");
        const colorCountInput = document.getElementById("colorCount");
        const paletteContainer = document.getElementById("palette");
        const previewOrb = document.getElementById("previewOrb");

        pickerTrigger.addEventListener("click", (e) => {
            e.stopPropagation();
            pickerPopover.classList.toggle("active");
            formatDropdownMenu.classList.remove("active");
        });

        document.addEventListener("click", (e) => {
            if (!pickerPopover.contains(e.target) && e.target !== pickerTrigger) {
                pickerPopover.classList.remove("active");
                formatDropdownMenu.classList.remove("active");
            }
        });

        formatSwitchBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            formatDropdownMenu.classList.toggle("active");
        });

        document.querySelectorAll(".format-option-item").forEach(item => {
            item.addEventListener("click", (e) => {
                e.stopPropagation();
                currentFormat = item.getAttribute("data-format");
                
                document.querySelectorAll(".format-option-item").forEach(opt => opt.classList.remove("selected"));
                item.classList.add("selected");

                formatDropdownMenu.classList.remove("active");
                generatePalette();
            });
        });

        let isDraggingSpectrum = false;

        function updateSpectrumFromMouse(e) {
            const rect = spectrumBox.getBoundingClientRect();
            let x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
            let y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));

            let s = Math.round((x / rect.width) * 100);
            const v = 100 - (y / rect.height) * 100;

            const l = (2 - s / 100) * (v / 100) / 2;
            if (l !== 0) {
                if (l === 1) {
                    s = 0;
                } else if (l < 0.5) {
                    s = (s / 100 * v / 100) / (l * 2) * 100;
                } else {
                    s = (s / 100 * v / 100) / (2 - l * 2) * 100;
                }
            }
            currentS = Math.round(s);
            currentL = Math.round(l * 100);

            spectrumCursor.style.left = `${x}px`;
            spectrumCursor.style.top = `${y}px`;

            generatePalette();
        }

        spectrumBox.addEventListener("mousedown", (e) => {
            isDraggingSpectrum = true;
            updateSpectrumFromMouse(e);
        });

        window.addEventListener("mousemove", (e) => {
            if (isDraggingSpectrum) updateSpectrumFromMouse(e);
        });

        window.addEventListener("mouseup", () => {
            isDraggingSpectrum = false;
        });

        hueSlider.addEventListener("input", (e) => {
            currentH = parseFloat(e.target.value);
            spectrumBox.style.backgroundColor = `hsl(${currentH}, 100%, 50%)`;
            generatePalette();
        });

        alphaSlider.addEventListener("input", (e) => {
            currentA = parseFloat(e.target.value);
            generatePalette();
        });

        colorCountInput.addEventListener("input", generatePalette);

        function hslToRgb(h, s, l) {
            s /= 100;
            l /= 100;
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const x = c * (1 - Math.abs((h / 60) % 2 - 1));
            const m = l - c / 2;
            let r = 0, g = 0, b = 0;

            if (0 <= h && h < 60) { r = c; g = x; b = 0; }
            else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
            else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
            else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
            else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
            else if (300 <= h && h < 360) { r = c; g = 0; b = x; }

            return {
                r: Math.round((r + m) * 255),
                g: Math.round((g + m) * 255),
                b: Math.round((b + m) * 255)
            };
        }

        function rgbToHex(r, g, b) {
            return "#" + [r, g, b].map(x => x.toString(16).padStart(2, "0")).join("");
        }

        function formatColorString(h, s, l, a, formatName) {
            const { r, g, b } = hslToRgb(h, s, l);

            switch (formatName) {
                case "RGB":
                    return a < 1 ? `rgba(${r}, ${g}, ${b}, ${a})` : `rgb(${r}, ${g}, ${b})`;
                case "HSL":
                    return a < 1 
                        ? `hsla(${Math.round(h)}, ${Math.round(s)}%, ${Math.round(l)}%, ${a})` 
                        : `hsl(${Math.round(h)}, ${Math.round(s)}%, ${Math.round(l)}%)`;
                case "HWB":
                    const w = Math.round((1 - s / 100) * (l / 100) * 100);
                    const bk = Math.round((1 - l / 100) * 100);
                    return `hwb(${Math.round(h)}deg ${w}% ${bk}%)`;
                case "LCH":
                    return `lch(${Math.round(l)}% ${Math.round(s * 0.8)} ${Math.round(h)})`;
                case "OKLCH":
                    return `oklch(${(l / 100).toFixed(2)} ${(s / 250).toFixed(2)} ${Math.round(h)})`;
                case "HEX":
                default:
                    return rgbToHex(r, g, b);
            }
        }

        function randomizeAndGenerate() {
            currentH = Math.floor(Math.random() * 360);
            currentS = Math.floor(Math.random() * 50) + 40;
            currentL = Math.floor(Math.random() * 50) + 30;
            currentA = 1;

            hueSlider.value = currentH;
            alphaSlider.value = currentA;
            spectrumBox.style.backgroundColor = `hsl(${currentH}, 100%, 50%)`;

            generatePalette();
        }

        function generatePalette() {
            const count = Math.min(Math.max(Number(colorCountInput.value || 1), 1), 10);

            paletteContainer.innerHTML = "";

            const baseRgb = hslToRgb(currentH, currentS, currentL);
            const baseCssColor = `rgba(${baseRgb.r}, ${baseRgb.g}, ${baseRgb.b}, ${currentA})`;

            formatValueInput.value = formatColorString(currentH, currentS, currentL, currentA, currentFormat);
            formatLabelSub.textContent = currentFormat;

            document.documentElement.style.setProperty("--bg-color", baseCssColor);
            previewOrb.style.background = baseCssColor;
            pickerTrigger.style.background = baseCssColor;
            currentColorCircle.style.background = baseCssColor;

            alphaSlider.style.background = `linear-gradient(to right, transparent, rgb(${baseRgb.r}, ${baseRgb.g}, ${baseRgb.b}))`;

            for (let i = 0; i < count; i++) {
                const center = (count - 1) / 2;
                const hueShift = (i - center) * 14;
                const lightShift = (center - i) * 3;

                const nextHue = (currentH + hueShift + 360) % 360;
                const nextSaturation = Math.min(Math.max(currentS + 4, 30), 95);
                const nextLightness = Math.min(Math.max(currentL + lightShift, 20), 85);

                const formattedString = formatColorString(nextHue, nextSaturation, nextLightness, currentA, currentFormat);
                const { r, g, b } = hslToRgb(nextHue, nextSaturation, nextLightness);
                const swatchBg = `rgba(${r}, ${g}, ${b}, ${currentA})`;

                const card = document.createElement("div");
                card.className = "color-card";

                card.innerHTML = `
                    <div class="swatch" style="background: ${swatchBg};"></div>
                    <div class="color-info">
                        <span class="tone-name">Tone ${i + 1}</span>
                        <span class="hex-label">${formattedString}</span>
                    </div>
                `;

                card.addEventListener("click", () => copyToClipboard(formattedString));
                paletteContainer.appendChild(card);
            }
        }

        function copyToClipboard(value) {
            navigator.clipboard.writeText(value).then(() => {
                const toast = document.getElementById("toast");
                toast.textContent = `${value} 복사되었습니다 🎉`;
                toast.classList.add("show");

                setTimeout(() => {
                    toast.classList.remove("show");
                }, 1800);
            });
        }

        spectrumBox.style.backgroundColor = `hsl(${currentH}, 100%, 50%)`;
        generatePalette();
    </script>
</body>
</html>
