<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Palette Hub</title>
    <link rel="stylesheet" href="css/main.css" />
</head>
<body>
    <header class="navbar">
        <div class="brand">🎨 SMART <span>PALETTE</span></div>
        <nav class="nav-links">
            <button type="button" class="nav-btn active" onclick="switchTab('color_palette.html', this)">
                Color Palette
            </button>
            <button type="button" class="nav-btn" onclick="switchTab('gradation_palette.html', this)">
                Gradation Palette
            </button>
        </nav>
    </header>

    <iframe id="mainFrame" class="content-frame" src="color_palette.html"></iframe>

    <script>
        function switchTab(page, element) {
            document.getElementById("mainFrame").src = page;
            document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
            element.classList.add("active");
        }
    </script>
</body>
</html>
