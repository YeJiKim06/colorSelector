<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Color Palette Generator</title>

    <style>
        :root {
            --bg-color: #6366f1;
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.82);
            --card-border: rgba(255, 255, 255, 0.35);
            --shadow: 0 24px 80px rgba(15, 23, 42, 0.22);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text-color);
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.32), transparent 32%),
                radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.22), transparent 36%),
                linear-gradient(135deg, var(--bg-color), #111827);
            transition: background 0.45s ease, color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 18px;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
            pointer-events: none;
        }

        .container {
            position: relative;
            width: min(100%, 760px);
            padding: 30px;
            border-radius: 34px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(22px);
            color: #111827;
        }

        .header {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 26px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(99, 102, 241, 0.1);
            color: #4f46e5;
            font-size: 0.78rem;
            font-weight: 800;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3.2rem);
            line-height: 1.05;
            letter-spacing: -0.06em;
        }

        .description {
            margin: 12px 0 0;
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.55;
        }

        .preview-orb {
            flex: 0 0 auto;
            width: 96px;
            height: 96px;
            border-radius: 30px;
            background: var(--bg-color);
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.35),
                0 18px 40px rgba(15, 23, 42, 0.24);
            transform: rotate(6deg);
            transition: background 0.35s ease, transform 0.25s ease;
        }

        .preview-orb:hover {
            transform: rotate(0deg) scale(1.04);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
            margin-bottom: 26px;
            padding: 14px;
            border-radius: 24px;
            background: rgba(248, 250, 252, 0.86);
            border: 1px solid rgba(226, 232, 240, 0.9);
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 58px;
            padding: 10px 14px;
            border-radius: 18px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
        }

        .input-group label {
            font-size: 0.84rem;
            font-weight: 800;
            color: #475569;
            white-space: nowrap;
        }

        input[type="color"] {
            width: 42px;
            height: 42px;
            border: 0;
            padding: 0;
            cursor: pointer;
            background: transparent;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 0;
            border-radius: 14px;
            box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.12);
        }

        input[type="number"] {
            width: 58px;
            border: 0;
            outline: 0;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
            font-size: 1rem;
            font-weight: 900;
            color: #111827;
        }

        button {
            min-height: 58px;
            padding: 0 20px;
            border: 0;
            border-radius: 18px;
            background: #111827;
            color: #ffffff;
            font-size: 0.92rem;
            font-weight: 850;
            cursor: pointer;
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.22);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            white-space: nowrap;
        }

        button:hover {
            transform: translateY(-2px);
            background: #020617;
            box-shadow: 0 18px 38px rgba(15, 23, 42, 0.28);
        }

        button:active {
            transform: translateY(0);
        }

        .palette {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 14px;
        }

        .color-card {
            position: relative;
            overflow: hidden;
            padding: 12px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(226, 232, 240, 0.9);
            cursor: pointer;
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
        }

        .color-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 36px rgba(15, 23, 42, 0.14);
            border-color: rgba(99, 102, 241, 0.35);
        }

        .swatch {
            height: 120px;
            border-radius: 18px;
            margin-bottom: 12px;
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.35),
                inset 0 -40px 80px rgba(0,0,0,0.12);
        }

        .color-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .tone-name {
            font-size: 0.76rem;
            font-weight: 900;
            color: #64748b;
        }

        .hex-label {
            padding: 6px 8px;
            border-radius: 999px;
            background: #f1f5f9;
            color: #0f172a;
            font-size: 0.72rem;
            font-weight: 900;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            letter-spacing: -0.02em;
        }

        .hint {
            margin-top: 18px;
            color: #64748b;
            font-size: 0.84rem;
            text-align: center;
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 34px;
            transform: translateX(-50%) translateY(16px);
            min-width: 210px;
            padding: 14px 18px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.92);
            color: #ffffff;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 800;
            box-shadow: 0 20px 50px rgba(0,0,0,0.28);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
            backdrop-filter: blur(12px);
            z-index: 20;
        }

        #toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 720px) {
            .container {
                padding: 22px;
                border-radius: 28px;
            }

            .header {
                flex-direction: column;
            }

            .preview-orb {
                width: 100%;
                height: 80px;
                border-radius: 24px;
                transform: none;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="header">
            <div>
                <div class="eyebrow">SMART PALETTE</div>
                <h1>Color Palette</h1>
                <p class="description">
                    기준 색상을 선택하면 어울리는 톤을 자동으로 생성합니다.
                    색상 카드를 클릭하면 HEX 코드가 복사됩니다.
                </p>
            </div>

            <div class="preview-orb" id="previewOrb"></div>
        </section>

        <section class="controls">
            <div class="input-group">
                <label for="baseColor">기준 색상</label>
                <input type="color" id="baseColor" value="#6366f1" />
            </div>

            <div class="input-group">
                <label for="colorCount">추출 개수</label>
                <input type="number" id="colorCount" value="5" min="1" max="10" />
            </div>

            <button type="button" onclick="randomizeAndGenerate()">
                랜덤 생성
            </button>
        </section>

        <section class="palette" id="palette"></section>

        <p class="hint">색상 카드를 클릭하면 HEX 코드가 클립보드에 복사됩니다.</p>
    </main>

    <div id="toast">복사되었습니다 🎉</div>

    <script>
        const baseColorInput = document.getElementById("baseColor");
        const colorCountInput = document.getElementById("colorCount");
        const paletteContainer = document.getElementById("palette");
        const previewOrb = document.getElementById("previewOrb");

        baseColorInput.addEventListener("input", generatePalette);
        colorCountInput.addEventListener("input", generatePalette);

        function hexToRgb(hex) {
            const cleanHex = hex.replace("#", "");

            return {
                r: parseInt(cleanHex.substring(0, 2), 16),
                g: parseInt(cleanHex.substring(2, 4), 16),
                b: parseInt(cleanHex.substring(4, 6), 16)
            };
        }

        function rgbToHex(r, g, b) {
            return "#" + [r, g, b]
                .map(value => {
                    const hex = Math.round(value).toString(16);
                    return hex.length === 1 ? "0" + hex : hex;
                })
                .join("")
                .toUpperCase();
        }

        function rgbToHsl(r, g, b) {
            r /= 255;
            g /= 255;
            b /= 255;

            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            let h;
            let s;
            const l = (max + min) / 2;

            if (max === min) {
                h = 0;
                s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);

                switch (max) {
                    case r:
                        h = (g - b) / d + (g < b ? 6 : 0);
                        break;
                    case g:
                        h = (b - r) / d + 2;
                        break;
                    default:
                        h = (r - g) / d + 4;
                        break;
                }

                h *= 60;
            }

            return { h, s: s * 100, l: l * 100 };
        }

        function hslToRgb(h, s, l) {
            s /= 100;
            l /= 100;

            const c = (1 - Math.abs(2 * l - 1)) * s;
            const x = c * (1 - Math.abs((h / 60) % 2 - 1));
            const m = l - c / 2;

            let r = 0;
            let g = 0;
            let b = 0;

            if (h >= 0 && h < 60) {
                r = c; g = x; b = 0;
            } else if (h >= 60 && h < 120) {
                r = x; g = c; b = 0;
            } else if (h >= 120 && h < 180) {
                r = 0; g = c; b = x;
            } else if (h >= 180 && h < 240) {
                r = 0; g = x; b = c;
            } else if (h >= 240 && h < 300) {
                r = x; g = 0; b = c;
            } else {
                r = c; g = 0; b = x;
            }

            return {
                r: (r + m) * 255,
                g: (g + m) * 255,
                b: (b + m) * 255
            };
        }

        function getBrightness(hex) {
            const { r, g, b } = hexToRgb(hex);
            return (r * 299 + g * 587 + b * 114) / 1000;
        }

        function randomizeAndGenerate() {
            const randomHex = "#" + Math.floor(Math.random() * 0xffffff)
                .toString(16)
                .padStart(6, "0");

            baseColorInput.value = randomHex;
            generatePalette();
        }

        function generatePalette() {
            const baseHex = baseColorInput.value;
            const count = Math.min(Math.max(Number(colorCountInput.value || 1), 1), 10);

            const { r, g, b } = hexToRgb(baseHex);
            const baseHsl = rgbToHsl(r, g, b);

            paletteContainer.innerHTML = "";

            document.documentElement.style.setProperty("--bg-color", baseHex);
            previewOrb.style.background = baseHex;

            const brightness = getBrightness(baseHex);
            document.documentElement.style.setProperty(
                "--text-color",
                brightness > 150 ? "#111827" : "#ffffff"
            );

            for (let i = 0; i < count; i++) {
                const center = (count - 1) / 2;
                const hueShift = (i - center) * 14;
                const lightShift = (center - i) * 3;

                const nextHue = (baseHsl.h + hueShift + 360) % 360;
                const nextSaturation = Math.min(Math.max(baseHsl.s + 4, 42), 92);
                const nextLightness = Math.min(Math.max(baseHsl.l + lightShift, 28), 78);

                const nextRgb = hslToRgb(nextHue, nextSaturation, nextLightness);
                const nextHex = rgbToHex(nextRgb.r, nextRgb.g, nextRgb.b);

                const card = document.createElement("div");
                card.className = "color-card";

                card.innerHTML = `
                    <div class="swatch" style="background: ${nextHex};"></div>
                    <div class="color-info">
                        <span class="tone-name">Tone ${i + 1}</span>
                        <span class="hex-label">${nextHex}</span>
                    </div>
                `;

                card.addEventListener("click", () => copyToClipboard(nextHex));
                paletteContainer.appendChild(card);
            }
        }

        function copyToClipboard(value) {
            navigator.clipboard.writeText(value).then(() => {
                const toast = document.getElementById("toast");
                toast.textContent = `${value} 복사되었습니다 🎉`;
                toast.classList.add("show");

                setTimeout(() => {
                    toast.classList.remove("show");
                }, 1800);
            });
        }

        generatePalette();
    </script>
</body>
</html>
